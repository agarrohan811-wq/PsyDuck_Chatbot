<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PsyDuck</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;

            background: radial-gradient(
                circle at top left,
                rgba(200, 170, 255, 0.35),
                #ffffff 60%
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        
        .chat-container {
            width: 480px;
            height: 600px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        
        .chat-header {
            padding: 20px;
            font-size: 34px;
            font-weight: 900;
            color: #DEB887;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin-bottom: 14px;
            align-items: flex-start;
        }

        .bot {
            justify-content: flex-start;
        }

        .user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 12px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            font-size: 15px;
        }

        .user .bubble {
            background: #E9E4F0;
        }

        .emoji {
            font-size: 28px;
            margin: 0 8px;
        }

        
        .input-area {
            display: flex;
            padding: 14px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-left: 10px;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">PsyDuck</div>

    <div id="messages"></div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="{{ url_for('static', filename='scripts.js') }}"></script>

</body>
</html>
